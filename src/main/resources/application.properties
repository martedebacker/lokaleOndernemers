spring.application.name=lokaleOndernemers

# Databank: H2 in een bestand (./data), zodat gegevens bewaard blijven tussen herstarts.
# Voor MySQL: vervang door bv. jdbc:mysql://localhost:3306/lokaleondernemers + username/password.
spring.datasource.url=jdbc:h2:file:./data/lokaleondernemers;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Uploads (logo's, banners, productfoto's)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

# Eerste beheerdersaccount (wordt enkel aangemaakt als er nog geen beheerder bestaat).
# Overschrijf in productie met omgevingsvariabelen APP_ADMIN_EMAIL / APP_ADMIN_WACHTWOORD.
app.admin.email=admin@lokaleondernemers.be
app.admin.wachtwoord=admin1234

# Voorbeeldondernemingen, -producten en een testklant aanmaken in een lege databank.
app.demo-data=false

server.servlet.session.timeout=2h

# ---- Testfase en opstarthulp ----
# Tot deze datum is het platform gratis voor ondernemers.
app.testfase.einde=2027-02-01
# Eenmalige prijs (EUR) als wij de winkelpagina voor een ondernemer inrichten.
app.opstarthulp.prijs=40

# ---- E-mail ----
# Adres van de site, voor links in e-mails.
app.basis-url=http://localhost:8080
app.mail.afzender=Lokale Ondernemers <noreply@lokaleondernemers.be>
# Zolang er geen SMTP-server ingesteld is (spring.mail.host), worden e-mails niet verstuurd maar als
# HTML-bestand bewaard in deze map, zodat je ze kan bekijken.
app.mail.voorbeeld-map=./mail-voorbeelden
# SMTP-server om echt te versturen, bv.:
#spring.mail.host=smtp.jouwprovider.be
#spring.mail.port=587
#spring.mail.username=noreply@lokaleondernemers.be
#spring.mail.password=...
