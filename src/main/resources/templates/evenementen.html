<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Evenementen')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: meldingen}"></div>
    <h1 class="mt">Wat is er te doen?</h1>
    <p class="zacht">Markten, workshops, proeverijen en opendeurdagen bij lokale ondernemers en van Lokale Ondernemers zelf.</p>

    <form class="zoekbalk" th:action="@{/evenementen}" method="get">
        <select name="regio" aria-label="Regio">
            <option value="">Alle regio's</option>
            <option th:each="r : ${alleRegios}" th:value="${r.id}" th:text="${r.naam}" th:selected="${r.id == gekozenRegio}">Regio</option>
        </select>
        <button class="knop" type="submit">Toon</button>
    </form>

    <div class="raster-breed" th:unless="${#lists.isEmpty(evenementen)}">
        <th:block th:each="e : ${evenementen}"><a th:replace="~{fragments/layout :: evenementkaart(${e})}"></a></th:block>
    </div>
    <div class="kaart leeg" th:if="${#lists.isEmpty(evenementen)}">
        <div class="groot">📅</div>
        <p>Er zijn momenteel geen evenementen gepland<span th:if="${gekozenRegio}"> in deze regio</span>.</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
